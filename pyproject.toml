[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gold-momentum-strategy"
version = "0.1.0"
description = "Walk-forward research on gold and Treasury momentum signals"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "pandas-datareader>=0.10",
  "seaborn>=0.13",
  "yfinance>=0.2",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4"]

[tool.setuptools.packages.find]
where = ["src"]
